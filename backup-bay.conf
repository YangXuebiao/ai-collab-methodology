# backup-bay.conf — 项目备份舱配置
# ⚠️ 被脚本 `. ./backup-bay.conf` source 引入，必须 shell 语法 key=value（等号两侧无空格，值含空格用引号）
#
# 本项目特点：**纯文档仓库**（方法论文档 + 模板），没有构建产物、没有依赖。
# 因此除去「不可再生的内容」之外几乎无可排除项 —— 舱很小，可以放心多打。

project=ai-collab-methodology

# 可再生排除（默认清单已含 node_modules/build/dist/.venv/coverage/__pycache__/*.pyc 等）
# 本项目是纯文档，没有可再生产物；只排掉临时/备份类文件，避免舱自我嵌套。
exclude_extra="*.tmp *.bak *~ .publish/backups/ backups/*.tar.zst"

# 不可再生数据根（git 不收但删了就没了 → 必打包）
# 本项目全部内容都在 git 里；`.publish/`（发布前检查工具 + 私有标识清单）
# **刻意不进舱** —— 它含一份私有标识清单，舱可能被拷来拷去，不带上。
extra_include=""

# DB dump hook（本项目无数据库）
db_dump_hook=""

# secrets 立场：本仓库是公开版，**不含任何 secrets**
secrets_included=false

# 依赖重建命令（本项目无依赖）
dep_rebuild="无需（纯文档仓库，无依赖）"

# 轮换阈值：代码舱保留数（阶段/出差舱永不自动删）
retain_code_bays=8

# 距上次打舱超过多少小时后「舱状态」提醒
stale_hours=168
