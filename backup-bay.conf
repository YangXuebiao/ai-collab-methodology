# backup-bay@0.2 配置：受限 key=value 数据，不执行 shell，不展开变量/命令。
# 只使用经过本地维护者审查的配置；不要把凭证写入此文件。
project=ai-collab-methodology

# 必选排除策略不可覆盖：.publish、常见秘密路径、backups、.git 等。
# 自定义排除支持空格分隔的 glob；不能表达含空格的单个 pattern。
exclude_extra="*.tmp *.bak *~"

# 旧字段保留为空；非空会拒绝，不能误以为树外数据已经备份。
extra_include=""

# 可选、可信本地导出命令和参数；不通过 shell 执行，不支持管道/重定向。
# 配置后失败、空输出、超时、超过文件限额均中止备份。不会自动导入数据库。
db_dump_hook=""
db_dump_timeout_seconds=60

# 仅作为恢复提示记录，不自动执行。
dep_rebuild="无需（纯文档仓库，无依赖）"

# gzip 使用 Python 标准库；zstd 还需要本机 zstd 命令。
compression=zstd
stale_hours=168

# 有限资源保护，可按受控环境调整。解压上限包含 tar 头和填充。
max_archive_bytes=268435456
max_unpacked_bytes=536870912
max_file_bytes=134217728
max_members=10000

# 不再用 secrets_included=false 声称无秘密：路径排除不是内容分类证明。
# 不再自动轮换删除；旧 retain_code_bays 若存在，仅兼容读取，不生效。
